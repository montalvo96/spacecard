# Configuración base (producción). Para desarrollo local se combina con
# docker-compose.dev.yml mediante COMPOSE_FILE en el .env local.

x-db-env: &db-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-spacecard}
  DB_USERNAME: ${DB_USERNAME:-spacecard}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}

x-app: &app
  build: .
  image: spacecard-app
  env_file: .env
  environment:
    <<: *db-env
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      <<: *db-env
      RUN_MIGRATIONS: "true"

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=90

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-spacecard}
      MYSQL_USER: ${DB_USERNAME:-spacecard}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  storage:
  mysql:
