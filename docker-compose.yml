x-app: &app
  build: .
  image: spacecard-app
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-spacecard}
    DB_USERNAME: ${DB_USERNAME:-spacecard}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "${APP_PORT:-8090}:80"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-spacecard}
      DB_USERNAME: ${DB_USERNAME:-spacecard}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RUN_MIGRATIONS: "true"

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=90

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-spacecard}
      MYSQL_USER: ${DB_USERNAME:-spacecard}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  storage:
  mysql:
